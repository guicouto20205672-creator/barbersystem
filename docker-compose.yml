services:
  server:
    image: cortezaproject/corteza:${VERSION}
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18091:80"
    networks:
      - internal
    volumes:
      - ./data/server:/data

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - corteza_db_data:/var/lib/postgresql/data
    networks:
      - internal

  corredor:
    image: cortezaproject/corteza-server-corredor:${VERSION}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - server
    networks:
      - internal
    volumes:
      - ./custom-extensions:/extensions:ro

volumes:
  corteza_db_data:

networks:
  internal:
    driver: bridge
